[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-equity-research"
version = "0.1.0"
description = "myGenAssist-powered Indian equity swing-research decision-support runner"
requires-python = ">=3.10"
dependencies = ["requests>=2.31.0", "python-dotenv>=1.0.1", "Flask>=3.0.0"]

[project.scripts]
indian-equity-research = "indian_equity_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
